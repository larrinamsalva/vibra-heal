name: Apply clickable frequency tag fix

on:
  push:
    branches: [feature/clickable-frequency-tags]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/clickable-frequency-tags
      - name: Apply focused source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          if 'library-tag-row' not in app:
              old = '''                    <span className="library-description">{entry.description}</span>\n                    <span className="tag-row">{entry.tags.slice(0, 3).map((tag) => <small key={tag}>{tag}</small>)}</span>\n                  </button>\n                  <button\n'''
              new = '''                    <span className="library-description">{entry.description}</span>\n                  </button>\n                  <span className="tag-row library-tag-row">{entry.tags.slice(0, 3).map((tag) => <button key={tag} onClick={() => setQuery(tag)}>{tag}</button>)}</span>\n                  <button\n'''
              if old not in app:
                  raise SystemExit('Expected frequency-card tag block was not found.')
              app = app.replace(old, new, 1)
              app_path.write_text(app)

          styles_path = Path('src/styles.css')
          styles = styles_path.read_text()
          if '.library-tag-row {' not in styles:
              old_select = ".library-card-select { min-width: 0; width: 100%; padding: 15px; border: 0; text-align: left; color: inherit; background: transparent; cursor: pointer; }"
              new_select = ".library-card-select { grid-column: 1; grid-row: 1; min-width: 0; width: 100%; padding: 15px; border: 0; text-align: left; color: inherit; background: transparent; cursor: pointer; }"
              old_tags = ".tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }\n.tag-row small { border: 1px solid rgba(255,255,255,.07); border-radius: 999px; padding: 4px 7px; color: #809996; background: rgba(0,0,0,.12); font-size: .62rem; }\n.favorite-star { width: 46px; border: 0; border-left: 1px solid rgba(255,255,255,.06); color: #718885; background: rgba(0,0,0,.08); cursor: pointer; font-size: 1.2rem; transition: .2s ease; }"
              new_tags = ".tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }\n.tag-row button { border: 1px solid rgba(255,255,255,.07); border-radius: 999px; padding: 4px 7px; color: #809996; background: rgba(0,0,0,.12); cursor: pointer; font-size: .62rem; }\n.tag-row button:hover { border-color: rgba(130, 241, 223, .34); color: var(--mint); background: rgba(130, 241, 223, .06); }\n.library-tag-row { grid-column: 1; grid-row: 2; margin-top: -4px; padding: 0 15px 15px; }\n.favorite-star { grid-column: 2; grid-row: 1 / span 2; width: 46px; border: 0; border-left: 1px solid rgba(255,255,255,.06); color: #718885; background: rgba(0,0,0,.08); cursor: pointer; font-size: 1.2rem; transition: .2s ease; }"
              if old_select not in styles or old_tags not in styles:
                  raise SystemExit('Expected frequency-card styles were not found.')
              styles = styles.replace(old_select, new_select, 1).replace(old_tags, new_tags, 1)
              styles_path.write_text(styles)

          sw_path = Path('public/sw.js')
          sw = sw_path.read_text()
          if "vibraheal-shell-v0.36" in sw:
              sw_path.write_text(sw.replace("vibraheal-shell-v0.36", "vibraheal-shell-v0.37", 1))

          test_path = Path('src/App.frequencyTags.test.tsx')
          if not test_path.exists():
              test_path.write_text('''// @vitest-environment jsdom\n\nimport { fireEvent, render, screen, within } from '@testing-library/react'\nimport { beforeEach, describe, expect, it, vi } from 'vitest'\nimport App from './App'\n\nvi.mock('@react-three/fiber', () => ({\n  Canvas: () => <div data-testid="mock-canvas" />,\n  useFrame: () => {},\n}))\n\nvi.mock('@react-three/drei', () => ({\n  Float: ({ children }: { children: unknown }) => children,\n  Sparkles: () => null,\n}))\n\ndescribe('Frequency Library tag controls', () => {\n  beforeEach(() => {\n    window.localStorage.clear()\n  })\n\n  it('lets a visible tag filter the library through the existing search and clear again', () => {\n    render(<App />)\n    const library = document.querySelector('.library-results')\n    expect(library).not.toBeNull()\n    const results = within(library as HTMLElement)\n\n    const lowToneTags = screen.getAllByRole('button', { name: 'low tone' })\n    expect(lowToneTags.length).toBeGreaterThan(0)\n    fireEvent.click(lowToneTags[0])\n\n    expect(screen.getByRole('searchbox')).toHaveValue('low tone')\n    expect(results.getByText('Deep Ground')).toBeInTheDocument()\n    expect(results.getByText('Ground')).toBeInTheDocument()\n    expect(results.queryByText('Open')).not.toBeInTheDocument()\n\n    fireEvent.click(screen.getByRole('button', { name: 'Clear frequency search' }))\n    expect(screen.getByRole('searchbox')).toHaveValue('')\n    expect(results.getByText('Open')).toBeInTheDocument()\n  })\n})\n''')
          PY
      - name: Commit focused fix
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Frequency tag fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css src/App.frequencyTags.test.tsx public/sw.js
          git commit -m "fix: make frequency library tags clickable"
          git push origin HEAD:feature/clickable-frequency-tags
