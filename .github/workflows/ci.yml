name: CI

on:
  push:
    branches: [main, build/vibraheal-react-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test privacy, accessibility, tools, and offline lifecycle
        run: npm test
      - name: Build
        run: npm run build
