name: CI

on:
  push:
    branches: [main, build/vibraheal-react-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test privacy, accessibility, tools, offline lifecycle, review artifacts, shared schemas, Artifact Inspector, compatibility guidance, passive guidance registry and loading, Workflow Map, Artifact Glossary, Artifact Version Guide, Artifact Support Status, Artifact Responsibility Map, Artifact Decision Boundary Guide, and Artifact Guidance Index
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify passive guidance code splitting
        run: node scripts/check-guidance-chunks.mjs
